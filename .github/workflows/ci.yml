name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # FUSE tests mount for real. Ubuntu's fusermount3 AppArmor profile only
      # lets mounts go under the user's home, so test temp dirs move there.
      - name: Set up FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # WinFsp tests mount real drives when WinFsp is installed, else skip.
      - name: Set up WinFsp
        if: runner.os == 'Windows'
        run: choco install winfsp -y --no-progress
      - name: go test
        run: go test -race -v -timeout 8m -count=3 ./fuse
